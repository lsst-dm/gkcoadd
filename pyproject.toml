[build-system]
requires = ["setuptools", "lsst-versions >= 1.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lsst-gkcoadd"
requires-python = ">=3.12.0"
description = "Image coaddition using fused Gaussian convolve/warp for Kaiser coadds."
license = "GPL-3.0-or-later"
license-files = ["COPYRIGHT", "LICENSE"]
readme = "README.rst"
authors = [
    { name = "Rubin Observatory Data Management", email = "dm-admin@lists.lsst.org" },
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["lsst"]
dependencies = ["astropy >= 7.0", "numpy >= 2.0", "scipy >= 1.13"]
dynamic = ["version"]

[project.urls]
"Homepage" = "https://github.com/lsst-dm/gkcoadd"
"Source" = "https://github.com/lsst-dm/gkcoadd"

[project.optional-dependencies]
test = ["pytest >= 7.4"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools]
zip-safe = true

[tool.setuptools.package-data]
"lsst.gkcoadd" = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "lsst_versions.get_lsst_version" }

[tool.lsst_versions]
write_to = "python/lsst/gkcoadd/version.py"

[tool.towncrier]
package = "lsst.gkcoadd"
package_dir = "python"
filename = "doc/lsst.gkcoadd/CHANGES.rst"
directory = "doc/changes"
title_format = "lsst-gkcoadd {version} ({project_date})"
issue_format = "`{issue} <https://rubinobs.atlassian.net/browse/{issue}>`_"


[[tool.towncrier.type]]
directory = "feature"
name = "New Features"
showcontent = true

[[tool.towncrier.type]]
directory = "api"
name = "API Changes"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug Fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "perf"
name = "Performance Enhancement"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Documentation Improvements"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Miscellaneous Changes of Minor Interest"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "An API Removal or Deprecation"
showcontent = true

# Present so that pytest does not look for configuration in parent
# directories. Can otherwise be empty.
[tool.pytest.ini_options]

[tool.pydocstyle]
convention = "numpy"
# Our coding style does not require docstrings for magic methods (D105)
# Our docstyle documents __init__ at the class level (D107)
# We allow methods to inherit docstrings and this is not compatible with D102.
# Docstring at the very first line is not required
# D200, D205 and D400 all complain if the first sentence of the docstring does
# not fit on one line.
add-ignore = ["D107", "D105", "D102", "D100", "D200", "D205", "D400"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    'if "sphinx" in sys.modules:',
    'if "sphinx" in sys.modules and not TYPE_CHECKING:',
]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["__init__.py"]

[tool.ruff.lint]
ignore = [
    "N802",
    "N803",
    "N806",
    "N812",
    "N815",
    "N816",
    "N999",
    "D107",
    "D105",
    "D102",
    "D104",
    "D100",
    "D200",
    "D205",
    "D400",
]
select = [
    "E",      # pycodestyle
    "F",      # pyflakes
    "N",      # pep8-naming
    "W",      # pycodestyle
    "D",      # pydocstyle
    "I",      # isort
    "C4",     # comprehensions
    "UP",     # pyupgrade
    "PT",     # Pytest linting
    "RUF022", # sort __all__
]
extend-select = [
    "RUF100", # Warn about unused noqa
]

[tool.ruff.lint.isort]
known-first-party = ["lsst"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 79

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 79

[tool.numpydoc_validation]
checks = [
    "all",  # All except the rules listed below.
    "SA01", # See Also section.
    "EX01", # Example section.
    "SS06", # Summary can go into second line.
    "GL01", # Summary text can start on same line as """
    "GL08", # Do not require docstring.
    "ES01", # No extended summary required.
    "RT01", # Unfortunately our @property trigger this.
    "RT02", # Does not want named return value. DM style says we do.
    "SS05", # pydocstyle is better at finding infinitive verb.
    "GL03", # ruff format of docstrings disagrees.
    "PR04", # We use type annotations.
    "SA04", # We do not need to add descriptions to see also entries.
]
exclude = [
    "^test_.*",       # Do not test docstrings in test code.
    '^__init__$',
    '\._[a-zA-Z_]+$', # Private methods.
]

[tool.mypy]
warn_unused_configs = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["astropy.*", "numpy.*", "scipy.*", "lsst.*"]
ignore_missing_imports = true

# Middleware dependencies ship type information, so import errors in their
# annotations are our problem too.
[[tool.mypy.overrides]]
module = ["lsst.images.*", "lsst.pipe.base.*"]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["lsst.gkcoadd.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
strict_equality = true
warn_unreachable = true
warn_unused_ignores = true

# Generated by lsst-versions, and may not exist when mypy runs.
[[tool.mypy.overrides]]
module = ["lsst.gkcoadd.version"]
ignore_missing_imports = true
